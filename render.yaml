# Official Infrastructure as Code specification for Render.com

databases:
  - name: learnpath-ai-db
    databaseName: learnpath_ai
    user: learnpath_admin
    plan: free
    region: oregon
    ipAllowList: [] # allow all connections

services:
  - type: web
    name: learnpath-ai-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: learnpath-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGIN
        value: "*"
